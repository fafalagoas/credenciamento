<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F7;--surface:#fff;--ink:#0F1E36;--muted:#5A6A82;--line:#D5DDE8;--blue:#123C7A;--blue-soft:#E3ECF8;--red:#C8102E;--green:#147A4B;--green-soft:#E1F3EA;--on-blue:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0C1524;--surface:#14213A;--ink:#E8EEF7;--muted:#9AA9C0;--line:#26375A;--blue:#5B8FE0;--blue-soft:#1A2D50;--red:#FF5A6E;--green:#4CC48A;--green-soft:#16352A;--on-blue:#0C1524;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,sans-serif}
header{background:var(--blue);color:var(--on-blue);padding:14px 16px;border-bottom:5px solid var(--red);font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:22px}
main{max-width:560px;margin:auto;padding:18px 16px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--blue);color:var(--on-blue)}
.btn.ok{background:var(--green);color:#fff;white-space:nowrap}
.btn:disabled{opacity:.5}
.meta{color:var(--muted);font-size:14px}
.err{color:var(--red);font-weight:600;font-size:14px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.pill{background:var(--green-soft);color:var(--green);font-weight:600;font-size:13px;padding:4px 10px;border-radius:99px;white-space:nowrap}
#busca{margin-top:4px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<header>FAF · Check-in de imprensa</header>
<main id="app">
  <form id="login" class="card">
    <label for="operador">Seu nome (operador)</label><input id="operador" autocomplete="name">
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <div class="err" id="erro" role="alert"></div>
    <button class="btn" style="width:100%;margin-top:14px">Entrar</button>
  </form>
</main>
<script>
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PIN = '', OPERADOR = '', partidas = [], lista = [], partidaAtual = '';
const run = () => google.script.run;

document.getElementById('login').addEventListener('submit', e => {
  e.preventDefault();
  PIN = document.getElementById('pin').value; OPERADOR = document.getElementById('operador').value.trim();
  if(!OPERADOR) return document.getElementById('erro').textContent = 'Informe seu nome.';
  run().withSuccessHandler(p => { partidas = p; partidaAtual = p[0] && p[0].id; tela(); carregar(); })
       .withFailureHandler(err => document.getElementById('erro').textContent = 'PIN inválido.')
       .partidasCheckin(PIN);
});

function tela(){
  app.innerHTML = `<div class="card"><label for="partida" style="margin-top:0">Partida</label>
    <select id="partida">${partidas.map(p => `<option value="${esc(p.id)}">${esc(p.jogo)}: ${esc(p.mandante)} x ${esc(p.visitante)} · ${esc(p.data)} ${esc(p.hora)}</option>`).join('')}</select>
    <label for="busca">Buscar por nome ou veículo</label><input id="busca" type="search">
    <p class="meta" id="resumo"></p></div>
    <div class="card" id="lista"><p class="meta">Carregando…</p></div>`;
  document.getElementById('partida').value = partidaAtual;
  document.getElementById('partida').addEventListener('change', e => { partidaAtual = e.target.value; carregar(); });
  document.getElementById('busca').addEventListener('input', desenhar);
}

function carregar(){
  document.getElementById('lista').innerHTML = '<p class="meta">Carregando…</p>';
  run().withSuccessHandler(l => { lista = l; desenhar(); })
       .withFailureHandler(e => document.getElementById('lista').innerHTML = '<p class="err">Não foi possível carregar a lista.</p>')
       .listarAprovados(PIN, partidaAtual);
}

function desenhar(){
  const q = (document.getElementById('busca').value || '').toLowerCase();
  const vis = lista.filter(a => (a.nome + ' ' + a.veiculo).toLowerCase().includes(q));
  document.getElementById('resumo').textContent = `${lista.filter(a => a.entrada).length} de ${lista.length} credenciados já entraram.`;
  document.getElementById('lista').innerHTML = vis.map(a => `<div class="row"><div><b>${esc(a.nome)}</b><br><span class="meta">${esc(a.funcao)} · ${esc(a.veiculo)}</span></div>
    ${a.entrada ? `<span class="pill">Entrou às ${esc(a.entrada)}</span>` : `<button class="btn ok" data-id="${esc(a.id)}">Registrar entrada</button>`}</div>`).join('')
    || '<p class="meta">Nenhum credenciado aprovado para esta partida.</p>';
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if(!b) return;
  b.disabled = true; b.textContent = 'Registrando…';
  run().withSuccessHandler(r => {
      const a = lista.find(x => x.id === b.dataset.id);
      if(r.ok) a.entrada = r.hora; else { alert(r.erro); carregar(); return; }
      desenhar();
    })
    .withFailureHandler(() => { alert('Falha de conexão. Tente de novo.'); b.disabled = false; b.textContent = 'Registrar entrada'; })
    .registrarCheckin(PIN, b.dataset.id, OPERADOR);
});
</script>
</body>
</html>
